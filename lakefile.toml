name = "ozip"
version = "1.0.0"
defaultTargets = [
  "OZIPVerification",
  "OZIPDecouplingN2",
  "OZIPDecouplingInductive",
  "OZIPTrialitySymmetrization",
  "OZIPTheorem5_1"
]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "OZIPVerification"

[[lean_lib]]
name = "OZIPDecouplingN2"

[[lean_lib]]
name = "OZIPDecouplingInductive"

[[lean_lib]]
name = "OZIPTrialitySymmetrization"

[[lean_lib]]
name = "OZIPTheorem5_1"

[[lean_lib]]
name = "OZIP_Unified_Theorem5_1"

[[lean_lib]]
name = "OZIPBilinearDirectSum"

[[lean_lib]]
name = "OZIPTheorem5_1Rank"
